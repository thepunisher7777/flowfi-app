<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#08111f" />
  <meta name="robots" content="noindex" />
  <title>Ledger</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;background:#07111f;color:#eef6ff}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111f;color:#eef6ff}body{display:grid;place-items:center;padding:24px}.boot{width:min(420px,100%);text-align:center}.mark{width:58px;height:58px;margin:0 auto 16px;border:1px solid #28577d;border-radius:18px;display:grid;place-items:center;background:#0c1b2f;color:#59adff;font-weight:900;letter-spacing:.08em}.boot h1{margin:0;font-size:24px;letter-spacing:-.03em}.boot p{margin:8px 0 0;color:#8fa8c2;font-size:13px;line-height:1.5}.retry{margin-top:18px;border:1px solid #28577d;background:#102f4e;color:#eef6ff;border-radius:12px;padding:10px 14px;font-weight:750}.hidden{display:none}
  </style>
  <script src="./posthog-bridge.js"></script>
  <script src="./arx-analytics-guard.js"></script>
  <script>
  (()=>{
    'use strict';
    const RELEASE='Beta 1.2';
    const CORE='./ledger-core.html';

    function upgradeCore(source){
      let html=String(source||'');
      html=html.replace("const APP_VERSION = 'Beta 1.1';",`const APP_VERSION = '${RELEASE}';`);
      html=html.replace("const ANALYTICS_NAMESPACE = 'thepunisher7777.github.io';","const ANALYTICS_NAMESPACE = 'ledger';");
      html=html.replace("const ANALYTICS_BASE = 'https://counterapi.com/api';","const ANALYTICS_BASE = 'https://arx.local/telemetry';");
      html=html.replaceAll('CounterAPI · sin ID de usuario enviado por Ledger','PostHog EU · telemetría anónima opt-in');
      html=html.replaceAll('LEDGER by ARX · Beta 1.1','LEDGER by ARX · Beta 1.2');
      if(html.includes('https://counterapi.com/api')) throw new Error('Legacy analytics endpoint survived bootstrap migration');
      if(!html.includes("const STORAGE_KEY = 'flowfi.public.v27';")) throw new Error('Ledger storage compatibility marker missing');
      const runtimeScripts='  <script src="./posthog-bridge.js"><\/script>\n  <script src="./arx-analytics-guard.js"><\/script>\n';
      if(!html.includes('arx-analytics-guard.js')) html=html.replace('</head>',runtimeScripts+'</head>');
      return html;
    }

    async function boot(){
      try{
        const response=await fetch(CORE,{cache:'no-store'});
        if(!response.ok) throw new Error(`Core HTTP ${response.status}`);
        const html=upgradeCore(await response.text());
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        console.error('[Ledger bootstrap]',error);
        document.addEventListener('DOMContentLoaded',()=>{
          const msg=document.getElementById('boot-status');
          const retry=document.getElementById('boot-retry');
          if(msg) msg.textContent='No se ha podido cargar Ledger. Comprueba la conexión y vuelve a intentarlo.';
          if(retry){retry.classList.remove('hidden');retry.onclick=()=>location.reload();}
        },{once:true});
      }
    }
    boot();
  })();
  </script>
</head>
<body>
  <main class="boot" aria-live="polite">
    <div class="mark">ARX</div>
    <h1>LEDGER</h1>
    <p id="boot-status">Cargando Ledger…</p>
    <button id="boot-retry" class="retry hidden" type="button">Reintentar</button>
  </main>
</body>
</html>
